name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: python -m unittest discover -s tests
      - name: Classification results are current
        run: |
          python tests/check_classification.py --json
          git diff --exit-code -I '"date"' -I '"python"' results/classification.json
