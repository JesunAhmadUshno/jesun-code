name: Release binaries

# When a GitHub release is published, build the standalone jesun binary
# for Linux, macOS, and Windows and attach each to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: jesun-linux-x64
            binary: dist/jesun
          - os: macos-latest
            asset: jesun-macos-arm64
            binary: dist/jesun
          - os: windows-latest
            asset: jesun-windows-x64.exe
            binary: dist/jesun.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Run the test suite
        run: python -m unittest discover -s tests
      - name: Build the binary
        run: python scripts/build_binary.py
      - name: Rename to the asset name
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}";
          gh release upload "$TAG"
          "${{ matrix.asset }}" --clobber
