v1.3.0: a frontend stack written in Jesun.Code itself: the <code>html</code> package (escaped HTML DSL), the <code>template</code> package ({{ }} placeholders, {% for %} loops, {% if %} conditionals), and the <code>js</code> package (breakout-proof JS strings, script_tag, dom_ready, on_event, js_fetch). Zero bridge, zero imports.
